<VirtualHost *:443>
    ServerName nova-flow.online
    ServerAlias www.nova-flow.online

    DocumentRoot /var/www/html/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/nova-flow.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nova-flow.online/privkey.pem

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
